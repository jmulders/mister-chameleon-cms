name: CI

# Guard the golden template against the class of bug that caused a demo 500:
# a blueprint/fieldset referencing a fieldtype not registered in THIS install
# (e.g. `type: tags`). Without CI that only surfaced on a fresh deploy. Runs the
# fieldtype guard + the app test suite on every PR to main and every push to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (a new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirror the Ploi runtime. composer.lock pins symfony/console v8.1, which
        # requires php >=8.4.1, so the deploy runs PHP 8.4 and the lock cannot even
        # install on 8.3 ("lock file does not contain a compatible set of packages").
        # Testing 8.3 would be a false failure that prod never hits, so it is 8.4 only.
        php: ["8.4"]
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Extensions the Statamic runtime uses on Ploi (image manipulation,
          # intl, archives, EXIF). Mirrors the deploy environment.
          extensions: gd, intl, zip, exif, mbstring, dom, curl, fileinfo, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      # The mister-chameleon/statamic add-on is a PUBLIC repo resolved over HTTPS,
      # so composer clones it anonymously — exactly as `composer install --no-dev`
      # does on the Ploi deploy. No token needed.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # The template is multisite (nl / en-gb / de), which requires Statamic
          # Pro — the Ploi deploy sets STATAMIC_PRO_ENABLED=true (buildDemoSecrets),
          # so CI must too, or the CP is behind a StatamicProRequiredException (500).
          sed -i 's/^STATAMIC_PRO_ENABLED=.*/STATAMIC_PRO_ENABLED=true/' .env
          # The guard + boot use the sqlite connection from .env.example.
          mkdir -p database
          touch database/database.sqlite

      # THE GUARD: fails (non-zero) when any blueprint/fieldset uses a fieldtype
      # that is not registered in this install — the tags-style demo-500 regression.
      - name: Check fieldtypes are all registered
        run: php please mc:check-fieldtypes

      - name: Run tests
        run: php artisan test
